[plugin]
id = "library-organizer"
name = "媒体库整理"
version = "0.2.3"
sdk = ">=0.6,<1"
entry = "library_organizer.plugin:LibraryOrganizer"
description = "下载保留原名，按 TMDB 生成媒体库硬链；状态保存在独立数据库。适配 AB 4.0.0。"
authors = ["gregwym"]
permissions = ["fs.write", "network"]

[[plugin.ui]]
slot = "settings.section"
element = "ab-plugin-library-organizer"
entry = "web/index.js"
title = { zh-CN = "媒体库整理", en-US = "Library organizer" }

[[plugin.ui]]
slot = "bangumi.detail.tab"
element = "ab-plugin-library-organizer-detail"
entry = "web/index.js"
title = { zh-CN = "媒体库", en-US = "Media library" }
